{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "smithd.fullname" . }}-flux-reader
  labels:
    {{- include "smithd.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  # Status of the Terraform CRs in the runner namespaces tf-<app> and of
  # their GitRepositories. smithd changes them only through git.
  - apiGroups: ["infra.contrib.fluxcd.io"]
    resources: ["terraforms"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "smithd.fullname" . }}-flux-reader
  labels:
    {{- include "smithd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "smithd.fullname" . }}-flux-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "smithd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Bound in each Terraform runner namespace tf-<app> by the RoleBinding
# smithd-terraform-reader-<env> that smithd commits, so smithd can read the
# readable plans and events there and nowhere else. The name is fixed: the
# committed RoleBindings refer to it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: smithd-terraform-reader
  labels:
    {{- include "smithd.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "events"]
    verbs: ["get", "list"]
{{- end }}
