apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smithd.configMapName" . }}
  labels:
    {{- include "smithd.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  DB_DRIVER: {{ .Values.config.database.driver | quote }}
  DB_DSN: {{ .Values.config.database.dsn | quote }}
  S3_BUCKET: {{ .Values.config.s3.bucket | quote }}
  S3_REGION: {{ .Values.config.s3.region | quote }}
  {{- if .Values.config.s3.endpoint }}
  AWS_ENDPOINT: {{ .Values.config.s3.endpoint | quote }}
  {{- end }}
  {{- if .Values.config.gitops.repo }}
  GITOPS_REPO: {{ .Values.config.gitops.repo | quote }}
  {{- end }}
  GITOPS_SSH_KEY_PATH: {{ .Values.config.gitops.sshKeyPath | quote }}
  GITOPS_USER_NAME: {{ .Values.config.gitops.userName | quote }}
  GITOPS_USER_EMAIL: {{ .Values.config.gitops.userEmail | quote }}
  FLUX_NAMESPACE: {{ .Values.config.flux.namespace | quote }}
  {{- if .Values.config.flux.kustomizationName }}
  FLUX_KUSTOMIZATION_NAME: {{ .Values.config.flux.kustomizationName | quote }}
  {{- end }}
  {{- with (include "smithd.uiUserHeader" .) }}
  UI_USER_HEADER: {{ . | quote }}
  {{- end }}
  {{- if .Values.uiProxy.enabled }}
  UI_LISTEN_ADDR: {{ printf "127.0.0.1:%v" .Values.uiProxy.uiPort | quote }}
  {{- end }}
  {{- with .Values.config.ui }}
  {{- if .allowedUsers }}
  UI_ALLOWED_USERS: {{ .allowedUsers | quote }}
  {{- end }}
  {{- if .trustedOrigins }}
  UI_TRUSTED_ORIGINS: {{ .trustedOrigins | quote }}
  {{- end }}
  {{- end }}
