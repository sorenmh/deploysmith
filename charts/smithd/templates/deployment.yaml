apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smithd.fullname" . }}
  labels:
    {{- include "smithd.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "smithd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "smithd.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "smithd.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.config.port }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "smithd.configMapName" . }}
        env:
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" . }}
              key: api-keys
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" . }}
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" . }}
              key: aws-secret-access-key
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" . }}
              key: slack-webhook-url
              optional: true
        # A PostgreSQL DSN holds a password, so it is kept in the secret;
        # when set it takes precedence over config.database.dsn
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" . }}
              key: database-dsn
              optional: true
        - name: VAPID_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" . }}
              key: vapid-public-key
              optional: true
        - name: VAPID_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" . }}
              key: vapid-private-key
              optional: true
        - name: FLUX_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" . }}
              key: flux-webhook-url
              optional: true
        - name: FLUX_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" . }}
              key: flux-webhook-token
              optional: true
        - name: NATS_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" . }}
              key: nats-url
              optional: true
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" . }}
              key: github-client-secret
              optional: true
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 12 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 12 }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
        - name: data
          mountPath: /data
        - name: ssh-key
          mountPath: /app/.ssh
          readOnly: true
        {{- with .Values.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.uiProxy }}
      {{- if .enabled }}
      # Signs users in and forwards them to the UI, which smithd serves on
      # localhost only, so this proxy is the only way to reach it
      - name: oauth2-proxy
        image: "{{ .image.repository }}:{{ .image.tag }}"
        imagePullPolicy: {{ .image.pullPolicy }}
        args:
        - --http-address=0.0.0.0:{{ .port }}
        - --upstream=http://127.0.0.1:{{ .uiPort }}/
        - --provider={{ .provider }}
        - --redirect-url=https://{{ required "uiProxy.host is required" .host }}/oauth2/callback
        - --reverse-proxy=true
        - --cookie-secure=true
        - --skip-provider-button=true
        - --email-domain=*
        # Static assets hold nothing private, and iOS fetches home screen
        # icons and the web manifest without the session cookie
        - --skip-auth-route=GET=^/ui/static/
        - --skip-auth-route=GET=^/ui/sw.js$
        {{- with .githubUsers }}
        - --github-user={{ . }}
        {{- end }}
        {{- with .githubOrg }}
        - --github-org={{ . }}
        {{- end }}
        {{- with .githubTeam }}
        - --github-team={{ . }}
        {{- end }}
        {{- range .extraArgs }}
        - {{ . }}
        {{- end }}
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" $ }}
              key: oauth2-proxy-client-id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" $ }}
              key: oauth2-proxy-client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "smithd.secretName" $ }}
              key: oauth2-proxy-cookie-secret
        ports:
        - name: ui
          containerPort: {{ .port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /ping
            port: ui
        readinessProbe:
          httpGet:
            path: /ping
            port: ui
        resources:
          {{- toYaml .resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
      {{- end }}
      {{- end }}
      volumes:
      - name: data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "smithd.pvcName" . }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: ssh-key
        secret:
          secretName: {{ include "smithd.secretName" . }}
          items:
          - key: gitops-ssh-key
            path: id_rsa
            mode: 0600
      {{- with .Values.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
