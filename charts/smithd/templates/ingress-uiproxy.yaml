{{- if .Values.uiProxy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "smithd.fullname" . }}-ui
  labels:
    {{- include "smithd.labels" . | nindent 4 }}
  {{- with .Values.uiProxy.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with (default .Values.ingress.className .Values.uiProxy.ingress.className) }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.uiProxy.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $.Values.uiProxy.host | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.uiProxy.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "smithd.fullname" . }}
                port:
                  name: ui
{{- end }}
