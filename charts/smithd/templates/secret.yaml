{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smithd.secretName" . }}
  labels:
    {{- include "smithd.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-keys: {{ .Values.secrets.apiKeys | quote }}
  aws-access-key-id: {{ .Values.secrets.aws.accessKeyId | quote }}
  aws-secret-access-key: {{ .Values.secrets.aws.secretAccessKey | quote }}
  gitops-ssh-key: {{ .Values.secrets.gitopsSshKey | quote }}
  {{- if .Values.secrets.slack.webhookUrl }}
  slack-webhook-url: {{ .Values.secrets.slack.webhookUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseDsn }}
  database-dsn: {{ .Values.secrets.databaseDsn | quote }}
  {{- end }}
  {{- if .Values.secrets.vapid.privateKey }}
  vapid-public-key: {{ .Values.secrets.vapid.publicKey | quote }}
  vapid-private-key: {{ .Values.secrets.vapid.privateKey | quote }}
  {{- end }}
  {{- if .Values.secrets.flux.webhookUrl }}
  flux-webhook-url: {{ .Values.secrets.flux.webhookUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.flux.webhookToken }}
  flux-webhook-token: {{ .Values.secrets.flux.webhookToken | quote }}
  {{- end }}
  {{- if .Values.secrets.nats.url }}
  nats-url: {{ .Values.secrets.nats.url | quote }}
  {{- end }}
  {{- if .Values.secrets.openbaoToken }}
  openbao-token: {{ .Values.secrets.openbaoToken | quote }}
  {{- end }}
  {{- if .Values.config.github.clientId }}
  github-client-secret: {{ required "config.github needs secrets.github.clientSecret" .Values.secrets.github.clientSecret | quote }}
  {{- end }}
  {{- if .Values.uiProxy.enabled }}
  oauth2-proxy-client-id: {{ required "uiProxy needs secrets.oauth2Proxy.clientId" .Values.secrets.oauth2Proxy.clientId | quote }}
  oauth2-proxy-client-secret: {{ required "uiProxy needs secrets.oauth2Proxy.clientSecret" .Values.secrets.oauth2Proxy.clientSecret | quote }}
  oauth2-proxy-cookie-secret: {{ required "uiProxy needs secrets.oauth2Proxy.cookieSecret" .Values.secrets.oauth2Proxy.cookieSecret | quote }}
  {{- end }}
{{- end }}
