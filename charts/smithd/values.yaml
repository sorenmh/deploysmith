# Default values for smithd Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/sorenmh/smithd
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: smithd.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: smithd-tls
  #    hosts:
  #      - smithd.example.com

# Web UI on its own host, behind an oauth2-proxy sidecar. smithd then serves
# the UI on localhost only, so signing in through the proxy is the only way
# to reach it; nothing can forge the user header, not even other pods. Works
# with any ingress controller. The UI user header defaults to
# X-Forwarded-User, the GitHub login with the GitHub provider.
#
# The proxy reads its OAuth app credentials from the smithd secret, keys
# oauth2-proxy-client-id, oauth2-proxy-client-secret and
# oauth2-proxy-cookie-secret (see secrets.oauth2Proxy).
uiProxy:
  enabled: false
  # Public host of the UI, e.g. smithui.example.com. The OAuth app's
  # callback URL is https://<host>/oauth2/callback
  host: ""
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.5
    pullPolicy: IfNotPresent
  provider: github
  # With the github provider: comma-separated GitHub users who may sign in.
  # Alternatively, or as well, restrict to an organization (and team).
  githubUsers: ""
  githubOrg: ""
  githubTeam: ""
  # Extra oauth2-proxy flags, e.g. --email-domain=example.com
  extraArgs: []
  port: 4180
  # Port smithd serves the UI on, bound to localhost
  uiPort: 8081
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 5m
      memory: 20Mi
  ingress:
    className: ""
    annotations: {}
    # Secret for the TLS certificate of host; no TLS if empty
    tlsSecretName: ""

# Ingress for the web UI (config.ui), protected by oauth2-proxy through
# ingress-nginx's external authentication. It routes /ui on the same hosts
# as the main ingress, so /ui is never reachable there without signing in.
# Deploy oauth2-proxy separately (see README).
uiIngress:
  enabled: false
  # Defaults to ingress.className
  className: ""
  # URL of your oauth2-proxy, used to build the auth annotations
  oauth2ProxyUrl: ""
  # Extra annotations, merged with the generated auth annotations
  annotations: {}

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

rbac:
  create: false

# Persistence for SQLite database
persistence:
  enabled: true
  # storageClass: "-"
  accessMode: ReadWriteOnce
  size: 10Gi
  # existingClaim: ""
  annotations: {}

# smithd Configuration
config:
  # Server port (should match service.targetPort)
  port: 8080

  # Database configuration
  database:
    # driver: sqlite or postgres
    driver: sqlite
    # dsn: file path for sqlite, connection string for postgres
    dsn: /data/smithd.db

  # S3 Storage configuration
  s3:
    bucket: deploysmith-versions
    region: us-east-1
    # endpoint: ""  # Optional: for MinIO or other S3-compatible storage

  # GitOps configuration
  gitops:
    # Git repository URL for GitOps deployments
    # Example: git@github.com:org/gitops.git or https://github.com/org/gitops.git
    repo: ""
    # SSH key path (will be mounted from secret)
    sshKeyPath: /app/.ssh/id_rsa
    # Git user configuration for commits
    userName: smithd
    userEmail: smithd@deploysmith.io

  # Flux integration (optional)
  flux:
    # Namespace where Flux Kustomization CRDs live
    namespace: flux-system
    # Name of the Flux Kustomization that applies the apps smithd deploys
    # (environments/<env>/apps). After a deploy smithd waits for it to apply
    # the commit and reports the outcome to Slack. Leave empty to disable.
    kustomizationName: ""

  # Web UI (optional), served at /ui
  ui:
    # Header carrying the signed-in user's email, set by an authenticating
    # proxy such as oauth2-proxy. Setting it enables the UI. With
    # ingress-nginx and oauth2-proxy (uiIngress below) use X-Auth-Request-Email.
    # smithd trusts this header, so /ui must only be reachable through the proxy.
    userHeader: ""
    # Comma-separated emails or @domain entries allowed to use the UI.
    # Empty allows everyone the proxy lets through.
    allowedUsers: ""
    # Comma-separated extra origins allowed to submit UI forms, only needed
    # if the Host header smithd sees differs from the public URL.
    trustedOrigins: ""
    # Set to true only if /ui is protected by an authenticating proxy that
    # this chart does not manage. Not needed with uiProxy or uiIngress. Otherwise the chart refuses to expose the
    # UI through the main ingress without uiIngress, since anyone could then
    # forge the user header.
    protectedExternally: false
    # Public URL of the UI, used to link to deployments from Slack messages.
    # Defaults to https://<uiProxy.host> with uiProxy.
    publicUrl: ""

# Secrets configuration
secrets:
  # API keys for authentication (comma-separated)
  # Generate with: openssl rand -hex 32
  apiKeys: ""

  # AWS credentials for S3 access
  aws:
    accessKeyId: ""
    secretAccessKey: ""

  # SSH private key for GitOps repository access
  # Provide the entire private key as a multiline string
  gitopsSshKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    # Add your SSH private key here
    -----END OPENSSH PRIVATE KEY-----

  # Slack notifications (optional)
  slack:
    webhookUrl: ""

  # Flux webhook receiver (optional)
  flux:
    webhookUrl: ""
    webhookToken: ""

  # NATS event publishing (optional)
  nats:
    url: ""

  # OAuth app for uiProxy. Generate the cookie secret with:
  #   openssl rand -base64 32 | tr -- '+/' '-_'
  oauth2Proxy:
    clientId: ""
    clientSecret: ""
    cookieSecret: ""

  # Alternatively, use existing secrets
  # If set, the above values will be ignored
  existingSecret: ""
  # Keys in the existing secret:
  #   - api-keys
  #   - aws-access-key-id
  #   - aws-secret-access-key
  #   - gitops-ssh-key
  #   - slack-webhook-url      (optional)
  #   - flux-webhook-url       (optional)
  #   - flux-webhook-token     (optional)
  #   - nats-url               (optional)
  #   - oauth2-proxy-client-id      (uiProxy)
  #   - oauth2-proxy-client-secret  (uiProxy)
  #   - oauth2-proxy-cookie-secret  (uiProxy)
