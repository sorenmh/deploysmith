name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Earthly
        uses: earthly/actions-setup@v1
        with:
          version: latest

      - name: Run tests
        run: earthly +test

      - name: Run linter
        run: earthly +lint
        continue-on-error: true

      - name: Build smithd
        run: earthly +build-smithd

      - name: Build forge
        run: earthly +build-forge

      - name: Verify binaries
        run: |
          ./bin/smithd --help || true
          ./bin/forge version

  test-postgres:
    name: Test against PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smithd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        # Packages share one database, so they run one at a time
        run: go test -p 1 ./internal/smithd/...
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/smithd?sslmode=disable
