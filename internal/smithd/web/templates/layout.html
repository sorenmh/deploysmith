{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} – deploysmith</title>
  <link rel="stylesheet" href="{{asset "app.css"}}">
  <script src="{{asset "htmx-2.0.4.min.js"}}" defer></script>
</head>
<body hx-boost="true">
  <header class="masthead">
    <div class="masthead__inner">
    <a class="wordmark" href="/ui/">deploysmith</a>
    <nav class="nav" aria-label="Main">
      <a href="/ui/apps"{{if eq .Section "apps"}} aria-current="page"{{end}}>Apps</a>
      <a href="/ui/deployments"{{if eq .Section "deployments"}} aria-current="page"{{end}}>Deployments</a>
      <a href="/ui/environments"{{if eq .Section "environments"}} aria-current="page"{{end}}>Environments</a>
    </nav>
    <span class="whoami">Signed in as {{.User}}</span>
    </div>
  </header>
  <main class="page">
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
