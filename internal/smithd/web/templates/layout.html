{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} – deploysmith</title>
  <link rel="icon" type="image/svg+xml" href="{{asset "favicon.svg"}}">
  <link rel="apple-touch-icon" href="{{asset "apple-touch-icon.png"}}">
  <link rel="manifest" href="{{asset "manifest.webmanifest"}}">
  <meta name="apple-mobile-web-app-title" content="deploysmith">
  <link rel="stylesheet" href="{{asset "app.css"}}">
  <!-- Swap error responses too, so validation errors and error pages are shown -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"...","swap":true}]}'>
  <script src="{{asset "htmx-2.0.4.min.js"}}" defer></script>
  <script src="{{asset "push.js"}}" defer></script>
</head>
<body hx-boost="true">
  <header class="masthead">
    <div class="masthead__inner">
    <a class="wordmark" href="/ui/">
      <svg class="wordmark__mark" viewBox="0 0 64 64" aria-hidden="true">
        <path class="wordmark__anvil" d="M4 27 H44 Q54 27 62 31.5 Q54 36 45 36 Q41 37 40.5 42 V47 L48 52 V59 H16 V52 L23.5 47 V42 Q23 37 17 36 H9 Q4 36 4 31.5 Z"/>
        <rect class="wordmark__ingot" x="12" y="19" width="24" height="6.5" rx="2.2"/>
        <path class="wordmark__sparks" d="M25 14 L22 6 M29.5 14.5 L34 7.5 M33 16.5 L40.5 13"/>
      </svg>
      deploysmith
    </a>
    <nav class="nav" aria-label="Main">
      <a href="/ui/apps"{{if eq .Section "apps"}} aria-current="page"{{end}}>Apps</a>
      <a href="/ui/deployments"{{if eq .Section "deployments"}} aria-current="page"{{end}}>Deployments</a>
      <a href="/ui/environments"{{if eq .Section "environments"}} aria-current="page"{{end}}>Environments</a>
    </nav>
    <span class="whoami">Signed in as {{.User}}
      {{if .PushKey}}<button type="button" id="push-toggle" class="push-toggle" data-key="{{.PushKey}}" hidden>Enable notifications</button>{{end}}
    </span>
    </div>
  </header>
  <main class="page">
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
