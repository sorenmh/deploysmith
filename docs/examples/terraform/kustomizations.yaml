# Flux objects that apply what smithd commits for Terraform apps, one set per
# environment (here dev), for the gitops repo next to the apps Kustomization.
# See docs/terraform-cluster-setup.md.
---
# environments/dev/terraform: runner namespaces, GitRepositories and
# Terraform CRs. No wait or healthChecks: a CR waiting for approval is
# Ready=Unknown, which would fail the Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: terraform-dev
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./environments/dev/terraform
  prune: true
  # The Kustomization that applies tofu-controller.yaml, so the CRDs exist
  dependsOn:
    - name: infrastructure
---
# Plan-only runs for draft versions (DEP-22) live on the branch "plans", so
# main stays clean
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitops-plans
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/sorenmh/gitops.git
  secretRef:
    name: gitops-readonly
  ref:
    branch: plans
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: terraform-plans-dev
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: gitops-plans
  path: ./environments/dev/terraform-plans
  prune: true
  dependsOn:
    - name: terraform-dev
